[package]
name = "sotf-gpui-toolkit-util"
version = "0.1.1"
edition = "2024"
description = "A collection of utility structs and functions used by Zed and GPUI"
license = "Apache-2.0"

[package.repository]
workspace = true

[package.readme]
workspace = true

[package.keywords]
workspace = true

[package.categories]
workspace = true

[package.metadata.release]
tag-name = "{{crate_name}}-v{{version}}"

[lib]
name = "util"
path = "src/util.rs"
doctest = true

[features]
test-support = ["rand", "util_macros", "path/test-support"]
debug-embed = ["rust-embed/debug-embed"]

[dependencies]
anyhow = "1.0.86"
dunce = "1.0"
globset = "0.4"
itertools = "0.15.0"
regex = "1.5"
tempfile = "3.20.0"
unicase = "2.6"
url = "2.2"
percent-encoding = "2.3.2"

[dependencies.collections]
workspace = true

[dependencies.rand]
version = "0.10"
optional = true

[dependencies.rust-embed]
version = "8.13"
features = ["compression", "include-exclude"]

[dependencies.schemars]
version = "1.0"
features = ["indexmap2"]

[dependencies.serde]
version = "1.0.221"
features = ["derive", "rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.serde_json_lenient]
version = "0.2"
features = ["preserve_order", "raw_value"]

[dependencies.util_macros]
workspace = true
optional = true

[dependencies.gpui_util]
workspace = true

[dependencies.path]
workspace = true
features = ["serde"]

[target.'cfg(any(unix, not(target_family = "wasm")))'.dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
futures-lite = "2"
futures = "0.3.34"
shlex = "2.0"
smol = "2.0"
async-fs = "2.1"
walkdir = "2.5"
dirs = "7.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies.async_zip]
version = "0.0.19"
features = ["deflate", "deflate64"]

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.7"
which = "8"

[target.'cfg(unix)'.dependencies]
command-fds = "0.3.1"
libc = "0.2"
tempfile = "3.20.0"

[target.'cfg(unix)'.dependencies.nix]
version = "0.31.3"
features = ["resource", "user"]

[target.'cfg(unix)'.dev-dependencies]
which = "8"

[target.'cfg(windows)'.dependencies]
which = "8"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Foundation_Numerics", "Globalization_DateTimeFormatting", "Storage_Search", "Storage_Streams", "System_Threading", "UI_ViewManagement", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_DirectComposition", "Win32_Graphics_DirectWrite", "Win32_Graphics_DirectManipulation", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Graphics_Hlsl", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Pipes", "Win32_System_RestartManager", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_Media"]

[dev-dependencies]
rand = "0.10"
tempfile = "3.20.0"

[dev-dependencies.util_macros]
version = "0.1.0"
package = "sotf-gpui-toolkit-util-macros"
path = "../util_macros"

[dev-dependencies.path]
workspace = true
features = ["test-support"]

# Intentionally not inheriting [workspace.lints]: it enables the clippy
# pedantic group, which this vendored upstream code does not target.
# The zero-warnings gate (issue #6) runs default rustc/clippy lints.
[lints]
