[package]
name = "sotf-gpui-toolkit-scheduler"
version = "0.1.0"
edition = "2024"
description.workspace = true
license = "Apache-2.0"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "scheduler"
path = "src/scheduler.rs"
doctest = false

[features]
test-support = []
wasm-threads = ["dep:wasm_thread"]

[dependencies]
async-channel = "2.5"
async-task = "4.7"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3.32"
parking_lot = "0.13"
rand = "0.10"
web-time = "1.1.0"

[target.'cfg(not(any(target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "visionos")))'.dependencies]
# backtrace 0.3 does not compile on Apple mobile targets with libc >= 0.2.190
# (the dyld image functions became macOS-only). src/test_scheduler.rs carries
# capture-less stand-ins there; see VENDORED.md.
backtrace = "0.3"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm_thread = { version = "0.3", features = ["es_modules"], optional = true }

[package.metadata.release]
tag-name = "{{crate_name}}-v{{version}}"

# Intentionally not inheriting [workspace.lints]: it enables the clippy
# pedantic group, which this vendored upstream code does not target.
# The zero-warnings gate (issue #6) runs default rustc/clippy lints.
[lints]
