[package]
name = "sotf-gpui-toolkit-gpui-wgpu"
version = "0.1.3"
edition = "2024"
description.workspace = true
license = "Apache-2.0"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "gpui_wgpu"
path = "src/gpui_wgpu.rs"

[features]
default = []
font-kit = ["dep:font-kit"]
# Enables the offscreen renderer used by adapter-backed GPUI visual QA.
headless-qa = ["gpui/test-support", "dep:image"]

[dependencies]
gpui = { workspace = true, default-features = false }
anyhow = "1.0"
bytemuck = "1"
collections = { workspace = true }
cosmic-text = { version = "0.19.0", package = "sotf-cosmic-text", path = "../../../cosmic-text" }
etagere = "0.2"
itertools = "0.15.0"
log = "0.4"
parking_lot = "0.12"
profiling = "1"
raw-window-handle = "0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
swash = "0.2.6"
gpui_util = { workspace = true }
wgpu = { package = "sotf-wgpu", path = "../../../wgpu/wgpu", version = "29.0.0" }
image = { workspace = true, optional = true }

# Optional: only needed on platforms with multiple font sources (e.g. Linux)
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { path = "../../../zed-font-kit", package = "sotf-zed-font-kit", version = "0.14.1-zed", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
js-sys = "0.3"

[package.metadata.release]
tag-name = "{{crate_name}}-v{{version}}"
