[package]
name = "sotf-vst3-com-macros-support"
version = "0.2.0"
authors = ["Microsoft Corp."]
edition = "2018"
description = """
Forked from com-rs

Support library for COM crate macros
"""
license = "MIT"

[lib]
name = "vst3_com_macros_support"

[dependencies]
syn = { version = "3.0.9", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0.1"

[package.metadata.release]
tag-name = "{{crate_name}}-v{{version}}"
